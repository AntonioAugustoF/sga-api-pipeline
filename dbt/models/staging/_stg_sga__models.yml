version: 2

models:
  - name: stg_sga__regionals
    description: >
      One row per regional in the most recent extraction batch, with string
      columns normalised exactly as the pandas path normalises them.
    columns:
      - name: codigo_regional
        description: >
          Natural key. The pandas path calls drop_duplicates here; this asserts
          uniqueness instead. A silent dedupe hides a source that started
          returning conflicting rows. Reporting success over incomplete data
          is the failure mode this pipeline exists to prevent.
        tests: [unique, not_null]

  - name: stg_sga__cooperatives
    description: >
      One row per cooperative in the most recent extraction batch. COLS_TO_DROP
      is declared in transform_cooperatives.py but never applied, so every
      column survives into the dimension; this model reproduces that.
    columns:
      - name: codigo_cooperativa
        description: Natural key. Asserted rather than deduped.
        tests: [unique, not_null]

  - name: stg_sga__statuses
    description: >
      Registration status reference list for customers and vehicles. Filtered
      by the API user's permissions, so a code the user cannot see is simply
      absent from the response rather than raising an error.
    columns:
      - name: codigo_situacao
        tests: [unique, not_null]
      - name: situacao_ativa
        description: >
          Whether the status itself is still in use by the source system — not
          whether the customer or vehicle carrying it is active.

  - name: stg_sga__invoice_statuses
    description: >
      Invoice status reference list. considerado_inadimplencia and pago encode
      business rules that live only in the source API, so persisting them makes
      the delinquency models auditable.
    columns:
      - name: codigo_situacao_boleto
        description: Renamed from the source's codigo_situacaoboleto.
        tests: [unique, not_null]

  - name: stg_sga__vehicles
    description: >
      One row per vehicle in the most recent extraction batch, normalised as
      transform/transform_vehicles.py normalises it. Reconciles against the
      current version of public.dim_vehicles on 52 of 53 columns; the exception
      is campos_opcionais, documented in the reconciliation test.
    columns:
      - name: codigo_veiculo
        description: >
          Natural key, and the key the snapshot versions on. Uniqueness matters
          more here than in a simple dimension: a duplicate would make the
          snapshot open two competing versions for the same vehicle.
        tests: [unique, not_null]

  - name: stg_sga__customers
    description: >
      One row per customer in the most recent extraction batch. descricao_situacao
      is mapped from the raw status list rather than from dim_status, preserving
      the source's original casing, and idade is recomputed on every run.
    columns:
      - name: codigo_associado
        tests: [unique, not_null]
      - name: idade
        description: >
          Age in full years, double precision to match the legacy column: pandas
          has no nullable integer, so a single null promoted the series to float.
          Negative for the customers whose birth date is in the future.
