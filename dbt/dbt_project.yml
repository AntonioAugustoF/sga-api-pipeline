name: sga_analytics
version: 0.1.0
profile: sga

model-paths: ["models"]
test-paths: ["tests"]

# Future models are made on schema 'analytics'. The 'public' schema is written
# by Python pipeline and here its just readed as source — the dbt never materializes
# nothing about it, so adopt the framework does not risk the existent DW.
models:
  sga_analytics:
    # No +schema here: dbt concatenates the custom schema to the target schema,
    # and profiles.yml already points to 'analytics' — keeping both would result in
    # analytics_analytics.
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: view